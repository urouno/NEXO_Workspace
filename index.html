    ],
    graficos: { 'Mosaico V': { a: '#121A1C', b: '#43F753', c: '#EEEBEF' }, 'Bloques diagonales': { a: '#121A1C', b: '#43F753', c: '#EEEBEF' }, 'Chevrones': { a: '#121A1C' }, 'Formas': { a: '#121A1C', c: '#293B3F' } },
    patron: { v: 'Isotipo', combo: 'Sobre negro' }
  },
  'Omova Comercializadora': {
    versiones: ['Vertical', 'Horizontal', 'Solo logotipo', 'Ícono'],
    versionGen: { 'Horizontal': 'La versión horizontal la arma NEXO con el ícono y el logotipo; el manual solo muestra la vertical.' },
    combos: [
      { n: 'Original', bg: '#FFFFFF', c: { icono: '#FF8000', texto: '#050526', v: '#FF8000' } },
      { n: 'Azul', bg: '#FFFFFF', c: { icono: '#050526', texto: '#050526', v: '#050526' } },
      { n: 'Sobre azul', bg: '#050526', c: { icono: '#FF8000', texto: '#FFFFFF', v: '#FF8000' } },
      { n: 'Blanco', bg: '#050526', c: blanco(['icono', 'texto', 'v']) },
      { n: 'Sobre naranja', bg: '#FF8000', gen: true, c: blanco(['icono', 'texto', 'v']) },
      { n: 'Naranja', bg: '#FFFFFF', gen: true, c: { icono: '#FF8000', texto: '#FF8000', v: '#FF8000' } }
    ],
    colores: [
      { n: 'Rich Black', hex: '#050526', rgb: '5, 5, 38', cmyk: '87%, 87%, 0%, 85%', pantone: 'Black 6 C' },
      { n: 'Orange', hex: '#FF8000', rgb: '255, 128, 0', cmyk: '0%, 50%, 100%, 0%', pantone: '151 C' }
    ],
    fuentes: [
      { n: 'Pure Mechanic', uso: 'Principal', logo: 'Solo logotipo' },
      { n: 'Montserrat', uso: 'Secundaria', pesos: [[400, 'Regular']], frase: 'abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ 1234567890', google: 'Montserrat' }
    ],
    graficos: {},
    patron: { v: 'Ícono', combo: 'Sobre azul' }
  }
};
const FUENTES_URL = 'https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Nunito+Sans:wght@300;400;600&family=Outfit:wght@500;700&family=Overpass:wght@300;400;600&family=Montserrat:wght@400&display=swap';
const PNG_ANCHOS = [1000, 2000, 4000];
const MARGENES = [['Sin margen', 0], ['Margen', .25], ['Amplio', .6]];

if (!S.mk) S.mk = { m: MARCAS_BRAND[0], v: {}, combo: {}, fondo: 'transparente', margen: 1, ancho: 2000, gColor: 'Original' };

/* ── Construcción de los SVG ─────────────────────────────── */
/** Un logo se describe como grupos colocados: [{x, y, s, l: {w, h, p}}] y su tamaño total. */
function logoDe(m, v) {
  const L = MARCA_ASSETS[m].logos;
  if (m === 'Omova Comercializadora' && v === 'Horizontal') {
    const ic = L['Ícono'], w = L['Solo logotipo'];
    const s = w.h * 1.25 / ic.h, gap = w.h * .45, icW = ic.w * s, icH = ic.h * s;
    const h = Math.max(icH, w.h);
    return { w: icW + gap + w.w, h, g: [{ x: 0, y: (h - icH) / 2, s, l: ic }, { x: icW + gap, y: (h - w.h) / 2, s: 1, l: w }] };
  }
  const l = L[v] || MARCA_ASSETS[m].graficos[v];
  return { w: l.w, h: l.h, g: [{ x: 0, y: 0, s: 1, l }] };
}
/* Color de cada rol: texto plano = relleno; objeto = {f relleno, s contorno, w grosor} */
function colorRol(combo, rol) {
  let c = combo.c[rol] ?? '#000000';
  if (typeof c === 'string') c = { f: c };
  if (combo.linea) c = { f: 'none', s: c.f, w: combo.linea };
  return c;
}
const n2 = v => +v.toFixed(2);
/**
 * Arma el SVG. o.fondo: color o '' (transparente) · o.margen: fracción del alto · o.px: ancho en px (para PNG) · o.recorte: sin margen ni sobrante de contornos (patrones).
 */
function svgLogo(logo, combo, o = {}) {
  let maxTrazo = 0, cuerpo = '';
  logo.g.forEach(gr => {
    const paths = gr.l.p.map(([rol, d, eo, sw]) => {
      const c = colorRol(combo, rol);
      if (sw) {                                   // trazo de línea (separador, anillo)
        maxTrazo = Math.max(maxTrazo, sw * gr.s);
        return `<path d="${d}" fill="none" stroke="${c.f === 'none' ? c.s : c.f}" stroke-width="${sw}"/>`;
      }
      if (c.s) maxTrazo = Math.max(maxTrazo, c.w * gr.s);
      return `<path d="${d}" fill="${c.f}"${eo ? ' fill-rule="evenodd"' : ''}${c.s ? ` stroke="${c.s}" stroke-width="${c.w}" stroke-linejoin="round"` : ''}/>`;
    }).join('');
    const t = gr.x || gr.y || gr.s !== 1 ? ` transform="translate(${n2(gr.x)} ${n2(gr.y)})${gr.s !== 1 ? ` scale(${+gr.s.toFixed(5)})` : ''}"` : '';
    cuerpo += t ? `<g${t}>${paths}</g>` : paths;
  });
  const pad = o.recorte ? 0 : (o.margen || 0) * Math.min(logo.w, logo.h) + maxTrazo / 2;
  const W = logo.w + pad * 2, H = logo.h + pad * 2;
  const tam = o.px ? ` width="${o.px}" height="${Math.round(o.px * H / W)}"` : '';
  const fondo = o.fondo ? `<rect x="${n2(-pad)}" y="${n2(-pad)}" width="${n2(W)}" height="${n2(H)}" fill="${o.fondo}"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${n2(-pad)} ${n2(-pad)} ${n2(W)} ${n2(H)}"${tam}>${fondo}${cuerpo}</svg>`;
}
/* Elemento gráfico: roles a, b, c con los colores originales o en un solo color */
function comboGrafico(m, nombre, modo) {
  const orig = MARCA_INFO[m].graficos[nombre] || {};
  const uno = modo === 'Negro' ? '#0D0D0D' : modo === 'Blanco' ? '#FFFFFF' : null;
  return { c: Object.fromEntries(['a', 'b', 'c'].map(r => [r, uno || orig[r] || '#0D0D0D'])) };
}
/* Patrón generado con el isotipo: filas alternadas sobre el color de fondo de la combinación */
function patronDe(m) {
  const P = MARCA_INFO[m].patron, base = logoDe(m, P.v).g[0].l;
  const combo = MARCA_INFO[m].combos.find(c => c.n === P.combo);
  const s = 40 / Math.max(base.w, base.h), paso = 80, cols = 6, filas = 4, g = [];
  for (let f = 0; f < filas; f++) for (let c = -1; c < cols; c++) {
    const x = c * paso + (f % 2 ? paso / 2 : 0) + (paso - base.w * s) / 2, y = f * paso + (paso - base.h * s) / 2;
    if (x + base.w * s <= 0 || x >= cols * paso) continue;
    g.push({ x, y, s, l: base });
  }
  return { logo: { w: cols * paso, h: filas * paso, g }, combo };
}
/** El patrón se recorta a su rectángulo (los íconos de las orillas quedan cortados) */
function svgPatron(m, o = {}) {
  const { logo, combo } = patronDe(m);
  return svgLogo(logo, combo, { fondo: combo.bg, px: o.px, recorte: true });
}

/* ── Descargas ───────────────────────────────────────────── */
const slug = v => norm(v).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function bajar(blob, nombre) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function bajarSvg(svg, nombre) { bajar(new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg], { type: 'image/svg+xml' }), nombre + '.svg'); }
/* El SVG ya trae width/height del tamaño final: el navegador lo dibuja en vector a esa resolución */
async function bajarPng(svg, nombre) {
  const w = +svg.match(/ width="(\d+)"/)[1], h = +svg.match(/ height="(\d+)"/)[1];
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    await new Promise((ok, mal) => { img.onload = ok; img.onerror = mal; img.src = url; });
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
    bajar(blob, nombre + '.png');
  } catch (e) { toast('No se pudo generar el PNG en este navegador. Descarga el SVG.', 'bad'); }
  finally { URL.revokeObjectURL(url); }
}

/* ── Colores ─────────────────────────────────────────────── */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
/* CMYK aproximado (sin perfil de color) para los colores que el PDF solo trae en HEX */
function rgbCmyk([r, g, b]) {
  const k = 1 - Math.max(r, g, b) / 255;
  if (k >= 1) return '0%, 0%, 0%, 100%';
  return [r, g, b].map(v => Math.round((1 - v / 255 - k) / (1 - k) * 100) + '%').concat(Math.round(k * 100) + '%').join(', ');
}
function datosColor(c) {
  return { ...c, rgb: c.rgb || hexRgb(c.hex).join(', '), cmyk: c.cmyk || rgbCmyk(hexRgb(c.hex)), calc: !c.cmyk };
}
function copiar(txt) {
  const ok = () => toast('Copiado: ' + txt);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => toast('No se pudo copiar.', 'bad'));
  else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('No se pudo copiar.', 'bad'); } t.remove(); }
}

/* ── Vista ───────────────────────────────────────────────── */
function cargarFuentesMarca() {
  if ($('#fuentesMarca')) return;
  const l = document.createElement('link'); l.id = 'fuentesMarca'; l.rel = 'stylesheet'; l.href = FUENTES_URL;
  document.head.appendChild(l);
}
function mkSel() {
  const m = S.mk.m, info = MARCA_INFO[m];
  const v = info.versiones.includes(S.mk.v[m]) ? S.mk.v[m] : info.versiones[0];
  const combo = info.combos.find(c => c.n === S.mk.combo[m]) || info.combos[0];
  return { m, info, v, combo };
}
function mkOpciones(combo) {
  return { fondo: S.mk.fondo === 'color' ? combo.bg : '', margen: MARGENES[S.mk.margen][1] };
}
function vistaMarcas() {
  cargarFuentesMarca();
  const { m, info, v, combo } = mkSel();
  const logo = logoDe(m, v);
  const op = mkOpciones(combo);
  const colores = info.colores.map(datosColor);
  const hayCalc = colores.some(c => c.calc);
  const grafs = Object.keys(MARCA_ASSETS[m].graficos);
  const gModo = S.mk.gColor;
  const gBg = gModo === 'Blanco' ? '#121A1C' : '#FFFFFF';
  return `
    <header class="topbar">
      <div><h1>Marcas</h1><div class="stats"><span>Logos, colores, tipografías y elementos gráficos</span></div></div>
    </header>
    <div class="toolbar">
      <div class="seg marcas" role="group" aria-label="Marca">
        ${MARCAS_BRAND.map(x => `<button data-mk-marca="${esc(x)}" aria-pressed="${m === x}" title="${esc(x)}">${esc(x)}</button>`).join('')}
      </div>
    </div>
    <div class="board-wrap" id="mkWrap">
      <section class="mk-sec" aria-labelledby="mkLogoT">
        <h2 class="grupo-t" id="mkLogoT">Logotipo</h2>
        <div class="mk-card mk-gen">
          <div class="mk-stage ${op.fondo ? '' : 'transp'}" style="background-color:${combo.bg}" id="mkStage">
            ${op.fondo ? '' : '<span class="badge">Fondo transparente</span>'}
            ${svgLogo(logo, combo, { margen: op.margen })}
          </div>
          <div class="mk-ctrl">
            <div class="field"><span class="label">Versión</span>
              <div class="seg" role="group" aria-label="Versión">${info.versiones.map(x => `<button data-mk-v="${esc(x)}" aria-pressed="${v === x}">${esc(x)}</button>`).join('')}</div>
              ${info.versionGen && info.versionGen[v] ? `<span class="hint">${esc(info.versionGen[v])}</span>` : ''}</div>
            <div class="field"><span class="label">Color</span>
              <div class="mk-combos" role="group" aria-label="Color">
                ${info.combos.map(c => `<button class="mk-combo" data-mk-combo="${esc(c.n)}" aria-pressed="${combo.n === c.n}" title="${esc(c.n)}${c.gen ? ' · generada (no viene en el manual)' : ''}">
                  <span class="th" style="background:${c.bg}">${svgLogo(logo, c, { margen: 0 })}</span>
                  <span class="nm">${c.gen ? '<i aria-hidden="true"></i>' : ''}${esc(c.n)}</span></button>`).join('')}
              </div>
              ${info.combos.some(c => c.gen) ? '<span class="hint">Las marcadas con punto azul son variantes generadas; no vienen en el manual.</span>' : ''}</div>
            <div class="field"><span class="label">Fondo</span>
              <div class="seg" role="group" aria-label="Fondo">
                <button data-mk-fondo="transparente" aria-pressed="${S.mk.fondo !== 'color'}">Transparente</button>
                <button data-mk-fondo="color" aria-pressed="${S.mk.fondo === 'color'}">Con fondo ${esc(combo.bg)}</button>
              </div></div>
            <div class="field"><span class="label">Área de protección</span>
              <div class="seg" role="group" aria-label="Margen">${MARGENES.map((x, i) => `<button data-mk-margen="${i}" aria-pressed="${S.mk.margen === i}">${x[0]}</button>`).join('')}</div></div>
            <div class="field"><span class="label">Tamaño del PNG (ancho)</span>
              <div class="seg" role="group" aria-label="Tamaño del PNG">${PNG_ANCHOS.map(x => `<button data-mk-ancho="${x}" aria-pressed="${S.mk.ancho === x}">${x.toLocaleString('es-MX')} px</button>`).join('')}</div></div>
            <div class="mk-dl">
              <button class="btn btn-primary" data-mk-bajar="png">${ico('download')}Descargar PNG</button>
              <button class="btn btn-sec" data-mk-bajar="svg">${ico('download')}Descargar SVG</button>
            </div>
            <span class="hint">El SVG es vectorial: sirve para imprenta y cualquier tamaño. El PNG sale nítido al ancho elegido.</span>
          </div>
        </div>
      </section>

      <section class="mk-sec" aria-labelledby="mkColT">
        <h2 class="grupo-t" id="mkColT">Colores</h2>
        <p class="hint">Clic en un valor para copiarlo.</p>
        <div class="mk-colors">${colores.map(c => `
          <article class="mk-card mk-color">
            <div class="sw" style="background:${c.hex}"></div>
            <div class="bd"><h3>${esc(c.n)}${c.comp ? ' <span class="badge">Complementario</span>' : ''}</h3>
              ${[['HEX', c.hex], ['RGB', c.rgb], [c.calc ? 'CMYK*' : 'CMYK', c.cmyk]].concat(c.pantone ? [['Pantone', c.pantone]] : [])
                .map(([k, val]) => `<button class="mk-val" data-copiar="${esc(val)}" title="Copiar ${esc(k)}"><b>${k}</b><span>${esc(val)}</span>${ico('copy')}</button>`).join('')}
            </div></article>`).join('')}
        </div>
        ${hayCalc ? '<p class="hint">* El manual solo trae el HEX de estos colores. RGB y CMYK se calcularon a partir de él; confirma el CMYK con la imprenta.</p>' : ''}
        ${info.degradados ? `<div class="mk-grads">${info.degradados.map(([n, a, b]) => `
          <button class="mk-card mk-grad" data-copiar="linear-gradient(90deg, ${a}, ${b})" title="Copiar CSS del degradado">
            <div class="sw" style="background:linear-gradient(90deg,${a},${b})"></div>
            <div class="bd"><b>${esc(n)}</b><span>${a} → ${b}</span></div></button>`).join('')}</div>` : ''}
      </section>

      <section class="mk-sec" aria-labelledby="mkTipT">
        <h2 class="grupo-t" id="mkTipT">Tipografías</h2>
        <div class="mk-fonts">${info.fuentes.map(f => `
          <article class="mk-card mk-font">
            <div class="card-top"><span class="badge">${esc(f.uso)}</span>${f.google ? '<span class="tipo">Google Fonts</span>' : '<span class="tipo">No está en Google Fonts</span>'}</div>
            ${f.google ? `
              <div class="muestra" style="font-family:'${f.google}';font-weight:${f.pesos[f.pesos.length - 1][0]}">${esc(f.n)}</div>
              ${f.pesos.map(([w]) => `<div class="abc" style="font-family:'${f.google}';font-weight:${w}${f.mayus ? ';text-transform:uppercase' : ''}">${esc(f.frase)}</div>`).join('')}
              <div class="pesos">${f.pesos.map(([w, n]) => `<span class="badge">${esc(n)} ${w}</span>`).join('')}</div>
              <div class="card-foot"><span></span><a class="btn btn-sec sm" href="https://fonts.google.com/specimen/${encodeURIComponent(f.google).replace(/%20/g, '+')}" target="_blank" rel="noopener noreferrer">Descargar ${ico('external')}</a></div>`
            : `<div class="muestra" style="font-size:24px;font-weight:600">${esc(f.n)}</div>
              <div class="sin-preview">${svgLogo(logoDe(m, f.logo), info.combos[0], { margen: 0 })}</div>
              <p class="hint">Fuente usada en el logotipo. No se puede mostrar aquí: instálala desde los archivos originales de la marca.</p>`}
          </article>`).join('')}
        </div>
      </section>

      <section class="mk-sec" aria-labelledby="mkGrafT">
        <div class="card-top"><h2 class="grupo-t" id="mkGrafT">Elementos gráficos</h2>
          ${grafs.length ? `<div class="seg" role="group" aria-label="Color de los elementos">${['Original', 'Negro', 'Blanco'].map(x => `<button data-mk-gcolor="${x}" aria-pressed="${gModo === x}">${x}</button>`).join('')}</div>` : ''}</div>
        <p class="hint">Descarga en SVG (vectorial) o PNG con fondo transparente, al ancho elegido arriba.</p>
        <div class="mk-grafs">
          ${grafs.map(n => `
            <article class="mk-card mk-graf">
              <div class="th transp" style="background-color:${gBg}">${svgLogo(logoDe(m, n), comboGrafico(m, n, gModo))}</div>
              <div class="bd"><b title="${esc(n)}">${esc(n)}</b><span style="display:flex;gap:4px">
                <button class="btn btn-sec sm" data-mk-graf="${esc(n)}" data-fmt="svg">SVG</button>
                <button class="btn btn-sec sm" data-mk-graf="${esc(n)}" data-fmt="png">PNG</button></span></div>
            </article>`).join('')}
          <article class="mk-card mk-graf">
            <div class="th" style="padding:0">${svgPatron(m)}</div>
            <div class="bd"><b title="Patrón generado con el ${esc(info.patron.v.toLowerCase())}">Patrón · generado</b><span style="display:flex;gap:4px">
              <button class="btn btn-sec sm" data-mk-patron="svg">SVG</button>
              <button class="btn btn-sec sm" data-mk-patron="png">PNG</button></span></div>
          </article>
        </div>
      </section>
    </div>`;
}
function bindMarcas() {
  const re = () => { const w = $('#mkWrap'), top = w ? w.scrollTop : 0; renderMain(); const n = $('#mkWrap'); if (n) n.scrollTop = top; };
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.onclick = () => { fn(b); re(); });
  on('[data-mk-marca]', b => { S.mk.m = b.dataset.mkMarca; });
  on('[data-mk-v]', b => { S.mk.v[S.mk.m] = b.dataset.mkV; });
  on('[data-mk-combo]', b => { S.mk.combo[S.mk.m] = b.dataset.mkCombo; });
  on('[data-mk-fondo]', b => { S.mk.fondo = b.dataset.mkFondo; });
  on('[data-mk-margen]', b => { S.mk.margen = +b.dataset.mkMargen; });
  on('[data-mk-ancho]', b => { S.mk.ancho = +b.dataset.mkAncho; });
  on('[data-mk-gcolor]', b => { S.mk.gColor = b.dataset.mkGcolor; });
  document.querySelectorAll('[data-copiar]').forEach(b => b.onclick = () => copiar(b.dataset.copiar));
  document.querySelectorAll('[data-mk-bajar]').forEach(b => b.onclick = () => {
    const { m, v, combo } = mkSel(), op = mkOpciones(combo);
    const nombre = [m, v, combo.n].map(slug).join('-') + (op.fondo ? '-fondo' : '');
    if (b.dataset.mkBajar === 'svg') bajarSvg(svgLogo(logoDe(m, v), combo, op), nombre);
    else bajarPng(svgLogo(logoDe(m, v), combo, { ...op, px: S.mk.ancho }), `${nombre}-${S.mk.ancho}px`);
  });
  document.querySelectorAll('[data-mk-graf]').forEach(b => b.onclick = () => {
    const m = S.mk.m, n = b.dataset.mkGraf, combo = comboGrafico(m, n, S.mk.gColor);
    const nombre = [m, n, S.mk.gColor].map(slug).join('-');
    if (b.dataset.fmt === 'svg') bajarSvg(svgLogo(logoDe(m, n), combo), nombre);
    else bajarPng(svgLogo(logoDe(m, n), combo, { px: S.mk.ancho }), `${nombre}-${S.mk.ancho}px`);
  });
  document.querySelectorAll('[data-mk-patron]').forEach(b => b.onclick = () => {
    const m = S.mk.m, nombre = slug(m) + '-patron';
    if (b.dataset.mkPatron === 'svg') bajarSvg(svgPatron(m), nombre);
    else bajarPng(svgPatron(m, { px: S.mk.ancho }), `${nombre}-${S.mk.ancho}px`);
  });
}

/* ── Arranque ────────────────────────────────────────────── */
if (S.token && S.user) iniciar(); else render();
</script>
